<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goldenacre BC | Admin Portal Login</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background-color: #173b32;
            color: #ffffff;
            font-family: Georgia, serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-card {
            background: #ffffff;
            color: #173b32;
            padding: 30px;
            border-radius: 12px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            text-align: center;
        }
        .login-card h2 {
            margin-bottom: 8px;
            font-size: 1.5rem;
        }
        .login-card p {
            color: #64748b;
            font-size: 0.9rem;
            margin-bottom: 24px;
        }
        .form-group {
            margin-bottom: 16px;
            text-align: left;
        }
        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: bold;
            margin-bottom: 6px;
        }
        .form-group input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 1rem;
            box-sizing: border-box;
        }
        .login-btn {
            background-color: #173b32;
            color: #ffffff;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }
        .login-btn:hover {
            background-color: #0f2721;
        }
        #error-msg {
            font-size: 0.88rem;
            font-weight: 600;
            margin-top: 14px;
            display: block;
            color: #dc2626;
        }
        .back-link {
            display: inline-block;
            margin-top: 18px;
            color: #64748b;
            text-decoration: none;
            font-size: 0.85rem;
        }
        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>🔒 Committee Admin</h2>
        <p>Sign in to access the site management portal</p>
        
        <form id="admin-login-form">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" required placeholder="admin" autocomplete="username">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" required placeholder="••••••••" autocomplete="current-password">
            </div>
            <button type="submit" id="submit-btn" class="login-btn">Log In to Admin</button>
            <p id="error-msg"></p>
        </form>

        <a href="index.html" class="back-link">&larr; Return to Home Site</a>
    </div>

    <!-- Supabase Auth Script -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const supabaseUrl = 'https://xprnfaadcqlxeamoywjs.supabase.co';
            const supabaseKey = 'sb_publishable_FLKn6BtisIoFBvS7lFjVFg_fRuprjea';
            
            // Renamed to 'supabaseClient' to avoid naming conflicts with the global CDN script
            const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

            const form = document.getElementById('admin-login-form');
            const errorMsg = document.getElementById('error-msg');
            const submitBtn = document.getElementById('submit-btn');

            if (!form) {
                console.error("Could not find #admin-login-form element!");
                return;
            }

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                errorMsg.innerText = '';
                submitBtn.disabled = true;

                const userInput = document.getElementById('username').value.trim();
                const password = document.getElementById('password').value;

                const fakeEmail = `${userInput}@goldenacre.local`;

                errorMsg.style.color = '#0369a1';
                errorMsg.innerText = "Connecting to server...";

                try {
                    const { data, error } = await supabaseClient.auth.signInWithPassword({
                        email: fakeEmail,
                        password: password
                    });

                    if (error) {
                        console.error("Supabase login error:", error);
                        errorMsg.style.color = '#dc2626';
                        errorMsg.innerText = error.message === "Invalid login credentials" 
                            ? "Invalid username or password." 
                            : error.message;
                        submitBtn.disabled = false;
                    } else {
                        errorMsg.style.color = '#16a34a';
                        errorMsg.innerText = "Success! Redirecting...";
                        window.location.replace('admin.html');
                    }
                } catch (err) {
                    console.error("Unexpected error:", err);
                    errorMsg.style.color = '#dc2626';
                    errorMsg.innerText = "Error: " + err.message;
                    submitBtn.disabled = false;
                }
            });
        });
    </script>
</body>
</html>
