<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#173b32">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Rinks Booking | Goldenacre Bowling Club</title>
  <link rel="manifest" href="rinks-booking-manifest.json">
  <link rel="apple-touch-icon" href="logo.jpeg">
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #173b32; }
    body { display: flex; flex-direction: column; }
    .install-panel { position: relative; z-index: 1; padding: 10px 16px; background: #f8fafc; border-bottom: 1px solid #dbe3e8; }
    .install-row { max-width: 1000px; margin: auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    h1 { margin: 0; font: bold 1rem Georgia, serif; }
    #install-help { margin: 4px 0 0; font-size: .82rem; color: #475569; }
    button { border: 0; border-radius: 6px; padding: 9px 13px; background: #173b32; color: white; font: inherit; font-weight: 700; cursor: pointer; white-space: nowrap; }
    button[hidden] { display: none; }
    #booking-frame { display: block; width: 100%; flex: 1 1 auto; min-height: 0; border: 0; }
    @media (max-width: 520px) { .install-row { align-items: flex-start; } h1 { font-size: .9rem; } #install-help { font-size: .74rem; } button { padding: 8px 10px; font-size: .82rem; } }
  </style>
</head>
<body>
  <section class="install-panel" aria-label="Install rink bookings">
    <div class="install-row">
      <div>
        <h1>Goldenacre Rinks Booking</h1>
        <p id="install-help" role="status">Add this booking app to your home screen for quick access.</p>
      </div>
      <button id="install-button" type="button" hidden>Install app</button>
    </div>
  </section>
  <iframe id="booking-frame" title="Goldenacre Bowling Club rink bookings" src="rinks_booking_system.html"></iframe>
  <script>
    const installButton = document.getElementById('install-button');
    const installHelp = document.getElementById('install-help');
    const bookingFrame = document.getElementById('booking-frame');
    let installPrompt;

    function isInstalledApp() {
      return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
    }

    function hideMembersPortalLink() {
      try {
        const portalLink = bookingFrame.contentDocument?.querySelector('header a[href="members_secure.html"]');
        if (portalLink && isInstalledApp()) portalLink.hidden = true;
      } catch (error) {
        console.warn('Could not update the booking navigation:', error);
      }
    }

    bookingFrame.addEventListener('load', hideMembersPortalLink);
    window.matchMedia('(display-mode: standalone)').addEventListener?.('change', hideMembersPortalLink);

    if (isInstalledApp()) {
      installHelp.textContent = 'You are using the rink bookings app.';
    } else {
      window.addEventListener('beforeinstallprompt', (event) => {
        event.preventDefault();
        installPrompt = event;
        installButton.hidden = false;
        installHelp.textContent = 'Install this app for quick, full-screen access to rink bookings.';
      });

      installButton.addEventListener('click', async () => {
        if (!installPrompt) return;
        installPrompt.prompt();
        await installPrompt.userChoice;
        installPrompt = null;
        installButton.hidden = true;
      });

      window.addEventListener('appinstalled', () => {
        installButton.hidden = true;
        installHelp.textContent = 'Rink bookings has been added to your device.';
      });

      if (/iPad|iPhone|iPod/.test(navigator.userAgent) && !window.navigator.standalone) {
        installHelp.textContent = 'On iPhone or iPad: tap Share in Safari, then “Add to Home Screen”.';
      } else if (!installPrompt) {
        installHelp.textContent = 'Use your browser menu and choose “Install app” or “Add to Home screen”.';
      }
    }
  </script>
</body>
</html>
