<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Events Calendar | Goldenacre Bowling Club</title>
    <link rel="icon" type="image/x-icon" href="photos/favicon.ico">
    <link rel="stylesheet" href="style.css">
    <style>
        /* View Toggle Switcher Styling */
        .events-view-toggle {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 20px 0;
        }
        .events-view-btn {
            background: #f1f5f9;
            color: #334155;
            border: 1px solid #cbd5e1;
            padding: 8px 16px;
            border-radius: 6px;
            font-family: inherit;
            font-weight: 700;
            font-size: 0.88rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .events-view-btn.active {
            background: #173b32;
            color: #ffcc00;
            border-color: #173b32;
        }
        /* Agenda List View Layout */
        .agenda-list-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
            max-width: 700px;
            margin: 0 auto;
        }
        .agenda-item-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 16px;
            display: flex;
            gap: 16px;
            align-items: flex-start;
            box-shadow: 0 2px 6px rgba(0,0,0,0.03);
            position: relative;
        }
    </style>
    <script src="events.js?version=104" defer></script>
    <script src="nav-loader.js" defer></script>
</head>
<body class="site-page">
    <header>
        <details class="site-menu">
            <summary>Club Links</summary>
            <div class="site-menu-panel">
                <!-- populated by nav-loader.js -->
            </div>
        </details>
        <a href="login.html" class="members-area-link">Members Area</a>
        <nav>
            <a href="index.html" class="header-badge-link" aria-label="Goldenacre Bowling Club home">
                <img src="logo.jpeg" alt="Goldenacre Bowling Club Logo" class="header-badge">
            </a>
        </nav>
    </header>

    <section class="hero">
        <div class="site-hero-content">
            <p class="hero-tagline">Bowling • Competition • Community</p>
            <h1>Events Calendar</h1>
        </div>
    </section>

    <main class="events-page">
        <!-- Shared Month Navigation Toolbar -->
        <div class="events-month-toolbar" style="margin-top: 20px;">
            <button class="events-month-button" id="previous-month" type="button" aria-label="Show previous month">&larr; <span>Previous</span></button>
            <h2 id="calendar-heading" aria-live="polite"></h2>
            <button class="events-month-button" id="next-month" type="button" aria-label="Show next month"><span>Next</span> &rarr;</button>
        </div>

        <p class="events-status" id="events-status" role="status" aria-live="polite"></p>

        <!-- Monthly List is the default; Calendar Grid remains available. -->
        <div class="events-view-toggle" role="group" aria-label="Choose calendar view">
            <button id="view-calendar-btn" class="events-view-btn" type="button" aria-pressed="false">📅 Calendar Grid</button>
            <button id="view-list-btn" class="events-view-btn active" type="button" aria-pressed="true">📋 Monthly List View</button>
        </div>

        <!-- Calendar Grid View Section -->
        <section class="events-calendar-section" id="calendar-view-section" aria-labelledby="calendar-heading" style="display: none;">
            <div class="calendar-weekdays" aria-hidden="true">
                <span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span>
            </div>
            <div class="calendar-grid" id="calendar-grid" aria-label="Events by day"></div>
        </section>

        <!-- Monthly List View Section -->
        <section class="events-calendar-section" id="list-view-section" aria-labelledby="list-heading">
            <div class="agenda-list-container" id="agenda-list-container"></div>
        </section>
    </main>

    <dialog class="events-detail-dialog" id="events-detail-dialog" aria-labelledby="events-detail-date">
        <div class="events-detail-content">
            <button class="events-detail-close" id="close-events-detail" type="button" aria-label="Close event details">&times;</button>
            <h2 id="events-detail-date"></h2>
            <div id="events-detail-list"></div>
        </div>
    </dialog>

    <footer>
        <p>&copy; 2026 Goldenacre Bowling Club (Edinburgh). All rights reserved.</p>
    </footer>

    <script>
        // events.js loads the events asynchronously; switch to the list after its first render.
        document.addEventListener('DOMContentLoaded', () => {
            const calendarGrid = document.getElementById('calendar-grid');
            const listButton = document.getElementById('view-list-btn');
            const calendarButton = document.getElementById('view-calendar-btn');
            if (!calendarGrid || !listButton || !calendarButton) return;

            calendarButton.addEventListener('click', () => {
                calendarButton.setAttribute('aria-pressed', 'true');
                listButton.setAttribute('aria-pressed', 'false');
            });
            listButton.addEventListener('click', () => {
                listButton.setAttribute('aria-pressed', 'true');
                calendarButton.setAttribute('aria-pressed', 'false');
            });

            const observer = new MutationObserver(() => {
                if (!calendarGrid.childElementCount) return;
                observer.disconnect();
                listButton.click();
            });
            observer.observe(calendarGrid, { childList: true });
        });
    </script>
</body>
</html>
