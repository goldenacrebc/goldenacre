name: Send Match Reminders

on:
  schedule:
    - cron: '0 * * * *' # Runs automatically every hour on the hour
  workflow_dispatch: # Allows you to manually click 'Run workflow' to test it anytime

jobs:
  check-fixtures:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install pywebpush requests

      - name: Run check script
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_ADMIN_EMAIL: ${{ secrets.VAPID_ADMIN_EMAIL }}
        run: python check_fixtures.py
