<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goldenacre Bowling Club - Admin Portal</title>
    
    <!-- Link your site stylesheets -->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="members_secure.css">
    
    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        .admin-wrapper {
            max-width: 520px;
            margin: 40px auto;
            padding: 0 15px;
        }
        .admin-card {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border: 1px solid #e2e8f0;
        }
        .admin-card h2 {
            margin-top: 0;
            margin-bottom: 20px;
            color: #111111;
            font-size: 1.4rem;
            text-align: center;
        }
        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 0.9rem;
            color: #334155;
        }
        .form-group input[type="text"],
        .form-group textarea,
        .form-group input[type="file"],
        .form-group select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            font-size: 0.95rem;
            box-sizing: border-box;
            font-family: inherit;
        }
        .form-group textarea {
            min-height: 120px;
            resize: vertical;
        }
        .form-group input:focus, .form-group textarea:focus, .form-group select:focus {
            outline: 2px solid #0369a1;
            border-color: transparent;
        }
        .submit-btn {
            background-color: #0369a1;
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background-color 0.2s ease;
            margin-top: 10px;
        }
        .submit-btn:hover {
            background-color: #0284c7;
        }
        .submit-btn:disabled {
            background-color: #94a3b8;
            cursor: not-allowed;
        }
        #status-msg {
            margin-top: 14px;
            text-align: center;
            font-size: 0.9rem;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <!-- Admin Header -->
    <header class="members-header">
        <h1>🔒 Goldenacre Admin Portal</h1>
        <a href="index.html" class="header-badge-link" aria-label="Goldenacre Bowling Club home">
            <img src="logo.jpeg" alt="Goldenacre Bowling Club Logo" class="header-badge">
        </a>
        <a href="index.html" id="logout-btn" class="logout-btn">Log Out</a>
    </header>

    <div class="admin-wrapper">
        <div class="admin-card">
            <h2>Publish News or Announcement</h2>
            <form id="news-form">
                <div class="form-group">
                    <label for="target-file">Select Target Section</label>
                    <select id="target-file">
                        <option value="news.json">Club News (news.json)</option>
                        <option value="events.json">Social Events (events.json)</option>
                        <option value="fixtures.json">Fixtures (fixtures.json)</option>
                    </select>
                </div>

                <!-- Category selector (only applies when news.json is selected) -->
                <div class="form-group" id="news-category-group">
                    <label for="news-category">News Category</label>
                    <select id="news-category">
                        <option value="internal">Internal Club News</option>
                        <option value="external">External Competitions</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="news-title">Headline / Title</label>
                    <input type="text" id="news-title" required placeholder="e.g. Opening Day Schedule Announced">
                </div>
                
                <div class="form-group">
                    <label for="news-content">Update Details / Story</label>
                    <textarea id="news-content" required placeholder="Write your club update here..."></textarea>
                </div>

                <div class="form-group">
                    <label for="news-image">Attach Photo (Optional)</label>
                    <input type="file" id="news-image" accept="image/*">
                </div>

                <button type="submit" id="publish-btn" class="submit-btn">Publish Update</button>
                <p id="status-msg"></p>
            </form>
        </div>
    </div>

    <footer>
        <p style="text-align: center; color: #64748b; font-size: 0.85rem; padding: 20px 0;">&copy; 2026 Goldenacre Bowling Club (Edinburgh). All rights reserved.</p>
    </footer>

    <!-- Admin Script -->
    <script>
        const supabaseUrl = 'https://xprnfaadcqlxeamoywjs.supabase.co';
        const supabaseKey = 'sb_publishable_FLKn6BtisIoFBvS7lFjVFg_fRuprjea';
        const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

        // 1. Restrict page to logged-in admin/members
        async function checkAdminAuth() {
            const { data: { user }, error } = await supabaseClient.auth.getUser();
            if (error || !user) {
                window.location.replace('admin_login.html');
            }
        }
        checkAdminAuth();

        // Show/hide category dropdown depending on target file selection
        const targetFileSelect = document.getElementById('target-file');
        const categoryGroup = document.getElementById('news-category-group');

        targetFileSelect.addEventListener('change', () => {
            if (targetFileSelect.value === 'news.json') {
                categoryGroup.style.display = 'block';
            } else {
                categoryGroup.style.display = 'none';
            }
        });

        // Helper to convert uploaded file to clean base64 string
        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onloadend = () => {
                    const base64String = reader.result.split(',')[1];
                    resolve(base64String);
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        function decodeBase64Utf8(base64Str) {
            const binString = atob(base64Str.replace(/\s/g, ''));
            const bytes = Uint8Array.from(binString, (m) => m.codePointAt(0));
            return new TextDecoder().decode(bytes);
        }

        function encodeUtf8Base64(str) {
            const bytes = new TextEncoder().encode(str);
            const binString = Array.from(bytes, (byte) => String.fromCodePoint(byte)).join("");
            return btoa(binString);
        }

        // 2. Handle form submission
        const newsForm = document.getElementById('news-form');
        const statusMsg = document.getElementById('status-msg');
        const publishBtn = document.getElementById('publish-btn');

        newsForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const targetFile = targetFileSelect.value;
            const category = document.getElementById('news-category').value;
            const title = document.getElementById('news-title').value.trim();
            const content = document.getElementById('news-content').value.trim();
            const imageFile = document.getElementById('news-image').files[0];

            statusMsg.style.color = '#0369a1';
            statusMsg.innerText = "Connecting to repository...";
            publishBtn.disabled = true;

            let imageUrl = "logo.jpeg";

            try {
                const owner = "goldenacrebc";
                const repo = "goldenacre";
                const branch = "main";
                // PASTE YOUR TOKEN HERE FOR LOCAL TESTING IF NEEDED:
                const githubToken = "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";

                // Upload photo to repository photos/ folder if attached
                if (imageFile) {
                    statusMsg.innerText = "Uploading photo to GitHub...";
                    const fileName = `${Date.now()}-${imageFile.name.replace(/\s+/g, '-')}`;
                    const photoPath = `photos/${fileName}`;
                    const photoBase64 = await fileToBase64(imageFile);

                    const photoUrl = `https://api.github.com/repos/${owner}/${repo}/contents/${photoPath}`;
                    const photoRes = await fetch(photoUrl, {
                        method: "PUT",
                        headers: {
                            "Authorization": `token ${githubToken}`,
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            message: `Admin upload: added photo ${fileName}`,
                            content: photoBase64,
                            branch: branch
                        })
                    });

                    if (!photoRes.ok) throw new Error("Failed to upload photo to GitHub repository.");
                    imageUrl = photoPath;
                }

                statusMsg.innerText = "Fetching current file data...";
                const fileUrl = `https://api.github.com/repos/${owner}/${repo}/contents/${targetFile}`;
                const getRes = await fetch(fileUrl, {
                    headers: { "Authorization": `token ${githubToken}` }
                });
                
                if (!getRes.ok) {
                    const errJson = await getRes.json().catch(() => ({}));
                    throw new Error(errJson.message || `Failed to fetch file (${getRes.status})`);
                }
                
                const fileData = await getRes.json();
                const existingContent = JSON.parse(decodeBase64Utf8(fileData.content));

                // Build new entry based on file type and selected category
                let newEntry = {};
                if (targetFile === 'news.json') {
                    const modalSlug = title.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
                    
                    newEntry = {
                        title: title,
                        description: content,
                        category: category, 
                        tag: "latest",
                        image: imageUrl,
                        modal: modalSlug
                    };
                } else if (targetFile === 'events.json') {
                    newEntry = {
                        date: new Date().toISOString().split('T')[0],
                        title: title,
                        time: "7:00 pm",
                        location: "Goldenacre Bowling club",
                        description: content,
                        notify: true
                    };
                } else {
                    newEntry = {
                        date: new Date().toISOString().split('T')[0],
                        team: "1st 16",
                        title: title,
                        time: "19:30 pm",
                        location: "Goldenacre",
                        description: content,
                        notify: true
                    };
                }

                existingContent.unshift(newEntry);

                statusMsg.innerText = "Committing update to GitHub...";
                const updatedContentBase64 = encodeUtf8Base64(JSON.stringify(existingContent, null, 2));
                
                const commitRes = await fetch(fileUrl, {
                    method: "PUT",
                    headers: {
                        "Authorization": `token ${githubToken}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        message: `Admin portal update: added ${title}`,
                        content: updatedContentBase64,
                        sha: fileData.sha,
                        branch: branch
                    })
                });

                if (!commitRes.ok) {
                    const errJson = await commitRes.json().catch(() => ({}));
                    throw new Error(errJson.message || `Failed to commit changes (${commitRes.status})`);
                }

                statusMsg.style.color = '#16a34a';
                statusMsg.innerText = "Successfully published! Please allow 1-2 mins for site to update.";
                newsForm.reset();
                categoryGroup.style.display = 'block';
                publishBtn.disabled = false;

            } catch (err) {
                console.error("Publishing error:", err);
                statusMsg.style.color = '#dc2626';
                statusMsg.innerText = "Error: " + err.message;
                publishBtn.disabled = false;
            }
        });

        // 3. Logout handler
        const logoutBtn = document.getElementById('logout-btn');
        if (logoutBtn) {
            logoutBtn.addEventListener('click', async (e) => {
                e.preventDefault();
                await supabaseClient.auth.signOut();
                window.location.replace('index.html');
            });
        }
    </script>
</body>
</html>
