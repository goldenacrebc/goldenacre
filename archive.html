<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News Archive | Goldenacre Bowling Club</title>
    <link rel="icon" type="image/x-icon" href="photos/favicon.ico">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="styles/archive-page.css">
    <script src="nav-loader.js" defer></script>
</head>
<body class="site-page">
    <header>
        <details class="site-menu"><summary>Club Links</summary><div class="site-menu-panel"><!-- populated by nav-loader.js --></div></details>
        <a href="login.html" class="members-area-link">Members Area</a>
        <nav><a href="index.html" class="header-badge-link" aria-label="Goldenacre Bowling Club home"><img src="logo.jpeg" alt="Goldenacre Bowling Club Logo" class="header-badge"></a></nav>
    </header>
    <section class="hero"><div class="site-hero-content"><p class="hero-tagline">Bowling • Competition • Community</p><h1>Goldenacre Bowling Club</h1></div></section>

    <main id="news" class="content-section archive-page">
        <h1>News Archive</h1>
        <p class="archive-intro">Choose a year, then a news category to browse past articles.</p>
        <div id="archive-years" aria-label="News archive by year"></div>
    </main>

    <footer>
        <p>&copy; 2026 Goldenacre Bowling Club (Edinburgh). All rights reserved.</p>
        <p class="footer-link"><a href="mailto:goldenacrebc@hotmail.com?&amp;subject=General%20Enquiry&amp;body=Hello%20Goldenacre%20Bowling%20Club,%0D%0A%0D%0AI%20would%20like%20to%20enquire%20about...">Send Us a Message</a></p>
    </footer>
    <script src="contact-form.js" defer></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const archiveYears = document.getElementById('archive-years');
            const currentYear = String(new Date().getFullYear());
            const categories = [
                { key: 'club', label: 'Club News' },
                { key: 'internal', label: 'Internal Club News' },
                { key: 'external', label: 'External Competitions' }
            ];

            try {
                const response = await fetch(`news.json?t=${Date.now()}`);
                if (!response.ok) throw new Error(`News feed returned ${response.status}`);
                const items = await response.json();
                const archivedItems = items
                    .filter(item => ['archive', 'archived'].includes(String(item.tag || '').toLowerCase()))
                    .filter(item => item.title || item.description);
                const byYear = new Map();

                archivedItems.forEach(item => {
                    const year = String(item.year || currentYear);
                    if (!byYear.has(year)) byYear.set(year, []);
                    byYear.get(year).push(item);
                });
                // Keep the current year available, even before anything has been archived for it.
                if (!byYear.has(currentYear)) byYear.set(currentYear, []);

                const years = [...byYear.keys()].sort((a, b) => Number(b) - Number(a));
                const yearNav = document.createElement('nav');
                yearNav.className = 'archive-year-list';
                yearNav.setAttribute('aria-label', 'Archive years');

                const categoryPanel = document.createElement('div');
                categoryPanel.className = 'archive-category-panel';
                categoryPanel.hidden = true;
                categoryPanel.setAttribute('aria-label', 'News categories');

                const results = document.createElement('div');
                results.className = 'archive-results';
                results.setAttribute('aria-live', 'polite');

                let activeYearButton = null;
                let activeCategoryButton = null;

                function showCategory(year, category, button) {
                    if (activeCategoryButton) activeCategoryButton.setAttribute('aria-current', 'false');
                    activeCategoryButton = button;
                    button.setAttribute('aria-current', 'true');
                    results.replaceChildren();

                    const yearItems = byYear.get(year) || [];
                    const categoryItems = yearItems.filter(item => {
                        const itemCategory = ['club', 'internal', 'external'].includes(item.category) ? item.category : 'external';
                        return itemCategory === category.key;
                    });

                    const heading = document.createElement('h2');
                    heading.className = 'archive-results-heading';
                    heading.textContent = `${category.label} — ${year}`;
                    results.appendChild(heading);

                    if (!categoryItems.length) {
                        const emptyMessage = document.createElement('p');
                        emptyMessage.className = 'archive-empty';
                        emptyMessage.textContent = `No ${category.label.toLowerCase()} archived for ${year}.`;
                        results.appendChild(emptyMessage);
                        return;
                    }

                    const list = document.createElement('ul');
                    list.className = 'archive-article-list';
                    categoryItems.forEach(item => {
                        const entry = document.createElement('li');
                        entry.className = 'archive-article';

                        const title = document.createElement('h3');
                        title.textContent = item.title || 'Untitled article';
                        entry.appendChild(title);

                        if (item.description) {
                            const description = document.createElement('p');
                            description.textContent = item.description;
                            entry.appendChild(description);
                        }
                        list.appendChild(entry);
                    });
                    results.appendChild(list);
                }

                years.forEach((year, index) => {
                    if (index > 0) {
                        const separator = document.createElement('span');
                        separator.className = 'archive-year-separator';
                        separator.setAttribute('aria-hidden', 'true');
                        separator.textContent = '|';
                        yearNav.appendChild(separator);
                    }

                    const yearButton = document.createElement('button');
                    yearButton.type = 'button';
                    yearButton.className = 'archive-year-button';
                    yearButton.textContent = year;
                    yearButton.setAttribute('aria-expanded', 'false');
                    yearButton.setAttribute('aria-controls', 'archive-category-panel');
                    yearButton.addEventListener('click', () => {
                        const isOpen = yearButton.getAttribute('aria-expanded') === 'true';
                        if (activeYearButton) {
                            activeYearButton.setAttribute('aria-expanded', 'false');
                            activeYearButton.classList.remove('is-active');
                        }
                        results.replaceChildren();
                        categoryPanel.replaceChildren();
                        if (activeCategoryButton) {
                            activeCategoryButton = null;
                        }

                        if (isOpen) {
                            categoryPanel.hidden = true;
                            activeYearButton = null;
                            return;
                        }

                        activeYearButton = yearButton;
                        yearButton.setAttribute('aria-expanded', 'true');
                        yearButton.classList.add('is-active');
                        categoryPanel.id = 'archive-category-panel';
                        categoryPanel.hidden = false;

                        categories.forEach(category => {
                            const categoryItems = (byYear.get(year) || []).filter(item => {
                                const itemCategory = ['club', 'internal', 'external'].includes(item.category) ? item.category : 'external';
                                return itemCategory === category.key;
                            });
                            const categoryButton = document.createElement('button');
                            categoryButton.type = 'button';
                            categoryButton.className = 'archive-category-button';
                            categoryButton.textContent = `${category.label} (${categoryItems.length})`;
                            categoryButton.addEventListener('click', () => showCategory(year, category, categoryButton));
                            categoryPanel.appendChild(categoryButton);
                        });
                    });
                    yearNav.appendChild(yearButton);
                });

                archiveYears.append(yearNav, categoryPanel, results);
            } catch (error) {
                console.error('Failed to load news.json', error);
                archiveYears.textContent = 'News archive could not be loaded. Please try again later.';
            }
        });
    </script>
</body>
</html>
