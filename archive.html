<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News Archive | Goldenacre Bowling Club</title>
    <link rel="icon" type="image/x-icon" href="photos/favicon.ico">
    <link rel="stylesheet" href="style.css">
    <script src="nav-loader.js" defer></script>
</head>
<body class="site-page">
    <header>
        <details class="site-menu"><summary>Club Links</summary><div class="site-menu-panel"><!-- populated by nav-loader.js --></div></details>
        <a href="login.html" class="members-area-link">Members Area</a>
        <nav><a href="index.html" class="header-badge-link" aria-label="Goldenacre Bowling Club home"><img src="logo.jpeg" alt="Goldenacre Bowling Club Logo" class="header-badge"></a></nav>
    </header>
    <section class="hero"><div class="site-hero-content"><p class="hero-tagline">Bowling • Competition • Community</p><h1>Goldenacre Bowling Club</h1></div></section>

    <main id="news" class="content-section archive-page">
        <h1>News Archive</h1>
        <div id="archive-years"></div>
    </main>

    <footer>
        <p>&copy; 2026 Goldenacre Bowling Club (Edinburgh). All rights reserved.</p>
        <p class="footer-link"><a href="mailto:goldenacrebc@hotmail.com?&amp;subject=General%20Enquiry&amp;body=Hello%20Goldenacre%20Bowling%20Club,%0D%0A%0D%0AI%20would%20like%20to%20enquire%20about...">Send Us a Message</a></p>
    </footer>
    <script src="contact-form.js" defer></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const archiveYears = document.getElementById('archive-years');
            const categories = [
                { key: 'club', label: 'Club News' },
                { key: 'internal', label: 'Internal Club News' },
                { key: 'external', label: 'External Competitions' }
            ];

            try {
                const response = await fetch(`news.json?t=${Date.now()}`);
                if (!response.ok) throw new Error(`News feed returned ${response.status}`);
                const items = await response.json();
                const archivedItems = items
                    .filter(item => ['archive', 'archived'].includes(String(item.tag || '').toLowerCase()))
                    .filter(item => item.title || item.description);
                const byYear = new Map();

                archivedItems.forEach(item => {
                    const year = String(item.year || 'Other years');
                    if (!byYear.has(year)) byYear.set(year, []);
                    byYear.get(year).push(item);
                });
                if (!byYear.has('2026')) byYear.set('2026', []);

                const years = [...byYear.keys()].sort((a, b) => {
                    if (a === 'Other years') return 1;
                    if (b === 'Other years') return -1;
                    return Number(b) - Number(a);
                });

                years.forEach(year => {
                    const section = document.createElement('section');
                    section.className = 'news-category-group';

                    const heading = document.createElement('h2');
                    heading.className = 'news-category-heading';
                    heading.textContent = year;
                    section.appendChild(heading);

                    categories.forEach(category => {
                        const categoryItems = byYear.get(year).filter(item => {
                            const itemCategory = ['club', 'internal', 'external'].includes(item.category) ? item.category : 'external';
                            return itemCategory === category.key;
                        });
                        if (!categoryItems.length) return;

                        const categoryHeading = document.createElement('h3');
                        categoryHeading.className = 'news-category-heading';
                        categoryHeading.textContent = category.label;
                        section.appendChild(categoryHeading);

                        const grid = document.createElement('div');
                        grid.className = 'news-grid-2col';
                        categoryItems.forEach(item => {
                            const article = document.createElement('article');
                            article.className = 'news-block';

                            const media = document.createElement('div');
                            media.className = 'news-media';
                            const image = document.createElement('img');
                            image.src = item.image || 'logo.jpeg';
                            image.alt = item.title || 'Club news';
                            image.className = 'news-img';
                            media.appendChild(image);
                            article.appendChild(media);

                            const body = document.createElement('div');
                            body.className = 'news-body';
                            const badge = document.createElement('span');
                            badge.className = `news-badge badge-${category.key}`;
                            badge.textContent = category.key === 'club' ? 'Club News' : category.key[0].toUpperCase() + category.key.slice(1);
                            body.appendChild(badge);

                            const title = document.createElement('h3');
                            title.textContent = item.title || '';
                            body.appendChild(title);
                            const description = document.createElement('p');
                            description.textContent = item.description || '';
                            body.appendChild(description);
                            article.appendChild(body);
                            grid.appendChild(article);
                        });
                        section.appendChild(grid);
                    });

                    if (!byYear.get(year).length) {
                        const emptyMessage = document.createElement('p');
                        emptyMessage.textContent = 'No archived news yet.';
                        section.appendChild(emptyMessage);
                    }
                    archiveYears.appendChild(section);
                });
            } catch (error) {
                console.error('Failed to load news.json', error);
                archiveYears.textContent = 'News archive could not be loaded. Please try again later.';
            }
        });
    </script>
</body>
</html>
